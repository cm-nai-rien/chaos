<!DOCTYPE html>
<html lang="en" data-site="movies">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chao's Lists</title>
    <link rel="stylesheet" href="assets/theme.css">
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; overflow: hidden; }
        html { scrollbar-gutter: auto; }   /* nothing scrolls here, so no reserved scrollbar strip */

        body {
            position: relative;
            margin: 0;
            background: #0b0b0b;
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
        }

        /* One screen, no scrolling: Movies | Books on top (60%), Chronology below (40%) */
        .split {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60fr 40fr;
        }

        .half {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(8px, 2.2vh, 28px);
            padding: 6vh 8% 3vh;
            min-height: 0;
            background: var(--bg-page);
            color: var(--text-primary);
            text-decoration: none;
            overflow: hidden;
        }
        .half::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(var(--c-deep-rgb), 0.35);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .half:hover::after { opacity: 1; }


        .half h2 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            letter-spacing: -3px;
            font-size: clamp(3.4rem, min(10.5vw, 15vh), 9.5rem);
            line-height: 1;
            margin: 0;
        }


        .covers {
            display: flex;
            height: clamp(70px, 17vh, 190px);
            align-items: flex-end;
        }
        .covers img {
            height: 92%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            margin-right: -3.2vh;
            box-shadow: var(--shadow-retro);
            background: var(--color-gray-light);
            transition: transform 0.3s;
        }
        .covers img:nth-child(odd)  { transform: rotate(-3deg); }
        .covers img:nth-child(even) { transform: rotate(2deg) translateY(-8px); }
        .half:hover .covers img { transform: none; }


        .cta {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid currentColor;
            align-self: flex-start;
            padding-bottom: 2px;
        }

        .chrono {
            grid-column: 1 / -1;
            position: relative;
            display: grid;
            grid-template-columns: 34% 1fr;
            align-items: center;
            gap: 4%;
            padding: 3.5vh 4% 5vh;
            min-height: 0;
            overflow: hidden;
            text-decoration: none;
            --paper: #f5ead8; --ink: #3d2409;
            background: var(--paper);
            color: var(--ink);
        }
        .chrono::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(61, 36, 9, 0.08);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .chrono:hover::after { opacity: 1; }
        .chrono-text { display: flex; flex-direction: column; gap: clamp(6px, 1.6vh, 18px); }
        .chrono h2 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 300;
            letter-spacing: -3px;
            font-size: clamp(2.6rem, min(7vw, 13vh), 8rem);
            line-height: 1;
            margin: 0;
        }

        /* mini timeline: latest works, books above the line, films below */
        .strip {
            position: relative;
            height: 100%;
            display: flex;
            gap: 1vh;
            justify-content: flex-end;
        }
        .strip::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 50%;
            border-top: 1.5px solid var(--ink);
        }
        .slot {
            position: relative;
            flex: 0 0 auto;
            display: grid;
            grid-template-rows: 1fr 1fr;
        }
        .slot img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: rgba(61, 36, 9, 0.08);
            box-shadow: 0 1px 3px rgba(61, 36, 9, 0.3);
            transition: transform 0.3s, opacity 0.45s ease;
        }
        .slot img:hover { opacity: 0.6; }
        .slot .up       { display: flex; align-items: flex-end; padding-bottom: var(--pad); min-height: 0; }
        .slot .down     { display: flex; align-items: flex-start; padding-top: var(--pad); min-height: 0; }
        .slot:nth-child(odd) img  { transform: rotate(-1.5deg); }
        .slot:nth-child(even) img { transform: rotate(1.2deg); }
        .chrono:hover .slot img { transform: none; }
        .slot .yr {
            position: absolute;
            left: 0; top: 50%;
            transform: translate(-30%, -50%);
            background: var(--paper);
            padding: 0 4px;
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(0.8rem, 1.8vh, 1rem);
            z-index: 1;
        }
        .slot .dot {
            position: absolute;
            left: 50%; top: 50%;
            width: 6px; height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: var(--ink);
        }

        .masthead {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1rem;
            color: #f0ebe3;
            white-space: nowrap;
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .footer-note {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 0.7rem;
            color: #f0ebe3;
            opacity: 0.5;
            mix-blend-mode: difference;
        }

        @media (max-width: 760px) {
            .split { grid-template-columns: 1fr; grid-template-rows: 30fr 30fr 40fr; }
            .half { padding: 5vh 24px 2vh; gap: 1.2vh; }
            .half .covers { display: none; }
            .chrono { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 2vh; padding: 3vh 24px 4vh; }
            .chrono-text { padding-left: 0; }
            .strip { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="masthead">Chao's Lists</div>

    <main class="split">
        <a class="half" data-site="movies" href="movies/">
            <h2>Movies</h2>
            <div class="covers" id="movies-covers"></div>
            <div class="cta">Open the movie list →</div>
        </a>

        <a class="half" data-site="books" href="books/">
            <h2>Books</h2>
            <div class="covers" id="books-covers"></div>
            <div class="cta">Open the book list →</div>
        </a>

        <a class="chrono" href="chronology/">
            <div class="chrono-text">
                <h2>Chronology</h2>
                <div class="cta">Open the chronology →</div>
            </div>
            <div class="strip" id="chrono-strip" aria-hidden="true"></div>
        </a>
    </main>

    <div class="footer-note">© 2026 Chao Wu</div>

    <script>
        const SITES = [
            { key: 'movies', file: 'movies/movies.json', image: 'poster' },
            { key: 'books',  file: 'books/books.json',   image: 'cover'  },
        ];

        // How much I wrote: CJK characters + Latin words
        const CJK = /[぀-ヿ㐀-鿿豈-﫿]/g;
        const reviewLength = t => {
            t = String(t || '');
            return (t.match(CJK) || []).length + (t.replace(CJK, ' ').match(/[A-Za-z0-9'’]+/g) || []).length;
        };

        const loaded = SITES.map(async site => {
            try {
                const items = await (await fetch(site.file, { cache: 'no-store' })).json();
                items.sort((a, b) => String(b.date_sort).localeCompare(String(a.date_sort)));

                const withImage = items.filter(i => i[site.image] && !String(i[site.image]).endsWith('null'));
                const box = document.getElementById(`${site.key}-covers`);
                withImage.slice(0, 5).forEach(i => {
                    const img = document.createElement('img');
                    img.src = i[site.image];
                    img.alt = '';
                    img.loading = 'lazy';
                    img.onerror = () => img.remove();
                    box.appendChild(img);
                });
                return items.map(i => ({ kind: site.key, date: String(i.date_sort), img: i[site.image], words: reviewLength(i.review) }));
            } catch (e) {
                return [];
            }
        });

        // Chronology preview: the most recent works that fit, oldest on the left.
        // Each image is sized by how much I wrote about it.
        let works = [], cap = 1;
        function drawStrip() {
            const strip = document.getElementById('chrono-strip');
            strip.replaceChildren();
            const vh = window.innerHeight / 100, gap = 0.8 * vh, pad = 1.2 * vh;
            strip.style.setProperty('--pad', pad + 'px');
            const maxW = Math.max(18, (strip.clientHeight / 2 - pad) * 2 / 3);
            const widthOf = w => maxW * (0.38 + 0.62 * Math.sqrt(Math.min(w.words, cap) / cap));

            const recent = [];
            let used = 0;
            for (const w of works) {
                const wd = widthOf(w);
                if (used + wd > strip.clientWidth) break;
                recent.push({ ...w, wd });
                used += wd + gap;
            }
            recent.reverse().forEach((w, i) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.style.width = w.wd + 'px';
                const up = document.createElement('div'), down = document.createElement('div');
                up.className = 'up'; down.className = 'down';
                const img = document.createElement('img');
                img.src = w.img; img.alt = ''; img.onerror = () => img.remove();
                (w.kind === 'books' ? up : down).appendChild(img);
                const dot = document.createElement('span'); dot.className = 'dot';
                slot.append(up, down, dot);
                const y = w.date.slice(0, 4);
                if (i === 0 || recent[i - 1].date.slice(0, 4) !== y) {
                    const yr = document.createElement('span'); yr.className = 'yr'; yr.textContent = y; slot.appendChild(yr);
                }
                strip.appendChild(slot);
            });
        }
        Promise.all(loaded).then(lists => {
            works = lists.flat()
                .filter(w => /^\d{4}-\d{2}-\d{2}$/.test(w.date) && !w.date.startsWith('0000') && w.img && !String(w.img).endsWith('null'))
                .sort((a, b) => b.date.localeCompare(a.date));
            // the longest reviews (top 10%) all get the biggest size
            const lens = works.map(w => w.words).sort((a, b) => a - b);
            cap = Math.max(1, lens[Math.floor(lens.length * 0.9)] || 1);
            drawStrip();
        });
        let resizeT;
        window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawStrip, 150); });
    </script>
</body>
</html>
